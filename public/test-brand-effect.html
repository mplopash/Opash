<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Brand Effect Test</title>
  <style>
    body { margin: 0; background: #060913; color: white; font-family: sans-serif; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px; }
    .card { position: relative; height: 350px; border-radius: 16px; overflow: hidden; border: 1px solid #333; }
    .card-light { background: #ffffff; color: #000; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .label { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
    
    /* Option 1: Tint via mix-blend on grayscale */
    .dark-opt1 video { filter: grayscale(1) contrast(1.2) brightness(0.9); }
    .dark-opt1 .tint {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 70%, #10b981 100%);
      mix-blend-mode: color;
      pointer-events: none;
    }
    .dark-opt1 .glow {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 70% 30%, rgba(16, 185, 129, 0.15), transparent 50%),
                  radial-gradient(circle at 30% 70%, rgba(29, 78, 216, 0.3), transparent 60%);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    /* Option 2: Pure brand color grading via filter */
    .dark-opt2 video { 
      filter: hue-rotate(205deg) saturate(1.8) contrast(1.15) brightness(0.95); 
    }

    /* Option 3: Light mode with grayscale + multiply */
    .light-opt1 video { 
      filter: invert(1) grayscale(1) contrast(1.2); 
      mix-blend-mode: multiply;
    }
    .light-opt1 .tint {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 70%, #10b981 100%);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    /* Option 4: Light mode pure blue/green hue-rotate */
    .light-opt2 video {
      filter: invert(1) hue-rotate(215deg) saturate(2.4) contrast(1.1) brightness(1.02);
      mix-blend-mode: multiply;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card dark-opt1">
      <div class="label">Dark: Grayscale + Mix-Blend Brand Colors (Pure Blue + Minimal Green)</div>
      <video src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_105406_16f4600d-7a92-4292-b96e-b19156c7830a.mp4" autoplay muted loop playsinline></video>
      <div class="tint"></div>
      <div class="glow"></div>
    </div>

    <div class="card dark-opt2">
      <div class="label">Dark: Hue-Rotate 205deg (Blue Ribbon)</div>
      <video src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_105406_16f4600d-7a92-4292-b96e-b19156c7830a.mp4" autoplay muted loop playsinline></video>
    </div>

    <div class="card card-light light-opt1">
      <div class="label">Light: Invert + Grayscale + Brand Tint</div>
      <video src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_105406_16f4600d-7a92-4292-b96e-b19156c7830a.mp4" autoplay muted loop playsinline></video>
      <div class="tint"></div>
    </div>

    <div class="card card-light light-opt2">
      <div class="label">Light: Invert + Hue-Rotate 215deg (Pure Blue)</div>
      <video src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_105406_16f4600d-7a92-4292-b96e-b19156c7830a.mp4" autoplay muted loop playsinline></video>
    </div>
  </div>
</body>
</html>
